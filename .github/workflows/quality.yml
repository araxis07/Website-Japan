name: Website quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_BASE_URL: https://example.test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-secrets.mjs
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - name: Install browser system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps chromium webkit
      - name: Install test browsers
        timeout-minutes: 6
        run: npx playwright install chromium webkit
      - run: node scripts/check-deployment.mjs --self-test
      - run: npm test
      - run: npm audit --audit-level=high
      - run: node scripts/check-links.mjs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: quality-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
